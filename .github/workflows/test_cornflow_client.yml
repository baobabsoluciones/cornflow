name: cornflow-client tests

on:
  pull_request:
    # `edited` is left out on purpose: it fires when the PR title or description changes
    types: [opened, synchronize, reopened]
    paths:
      - 'libs/client/**'
      - '.github/workflows/test_cornflow_client.yml'
      - '!libs/client/README.rst'
      - '!libs/client/setup.py'
  push:
    branches:
      - master
    paths:
      - 'libs/client/**'
      - '.github/workflows/test_cornflow_client.yml'
      - '!libs/client/README.rst'
      - '!libs/client/setup.py'

# A new push to the same PR cancels the run still going for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    name: Run unit test on cornflow-client
    defaults:
      run:
        working-directory: ./libs/client
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'libs/client/requirements*.txt'
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system .
      - name: Test
        run: |
          coverage run --source=./cornflow_client/ --rcfile=./.coveragerc -m unittest discover -s cornflow_client/tests/unit
          coverage report -m

  integration:
    name: Run all test suites on cornflow-client
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./libs/client
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'
      - name: Copy DAG files
        run: |
          cd ..
          cd ..
          cp -r cornflow-dags/DAG/* cornflow-server/airflow_config/dags/
          cp cornflow-dags/requirements.txt cornflow-server/airflow_config/
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system .
      - name: Install airflow
        run: |
          cd ..
          cd ..
          cd cornflow-server
          uv venv afvenv --python "$(python -c 'import sys; print(sys.executable)')"
          source afvenv/bin/activate
          AIRFLOW_VERSION=3.2.2
          PYTHON_VERSION="$(python3 --version | cut -d " " -f 2 | cut -d "." -f 1-2)"
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          # The fab extra provides FabAuthManager and the `airflow users create` CLI,
          # which moved out of Airflow core in Airflow 3.
          uv pip install "apache-airflow[fab]==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          uv pip install -r airflow_config/requirements.txt
          uv pip install --reinstall-package cornflow-client \
            "cornflow-client @ git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
          # Airflow 3 replaced `db init` with the idempotent `db migrate`
          airflow db migrate
          airflow users create -u admin -f admin -l admin -r Admin -p admin -e admin@example.org
          # Airflow 3 renamed `webserver` to `api-server` and no longer parses DAGs in the
          # scheduler: a standalone dag-processor is mandatory.
          airflow api-server -p 8080 &
          airflow scheduler &
          airflow dag-processor &
          # Wait for the api-server to answer and for the dag-processor to parse the DAGs
          # before cornflow registers them.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v2/monitor/health > /dev/null; then break; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if airflow dags list -o json 2>/dev/null | grep -q '"solve_model_dag"'; then break; fi
            sleep 2
          done
          airflow dags list
          # Import errors are only written to the dag-processor log files, so surface them here
          airflow dags list-import-errors
          deactivate
        env:
          AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 0
          AIRFLOW_HOME: '${GITHUB_WORKSPACE}/cornflow-server/airflow_config'
          AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 0
          # Airflow 3: AUTH_BACKENDS (plural) replaces AUTH_BACKEND, and the FAB auth manager
          # has to be selected explicitly (it backs `airflow users create`)
          AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
          AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
          # Shared JWT secret between api-server, scheduler and dag-processor
          AIRFLOW__API_AUTH__JWT_SECRET: 4f8c1b2e9d7a6c5b3e2f1a0d9c8b7a6e5f4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
          AIRFLOW__API__SECRET_KEY: e9adafa751fd35adfc1fdd3285019be15eea0758f76e38e1e37a1154fb36
          AIRFLOW__CORE__LOAD_EXAMPLES: 0
          AIRFLOW_CONN_CF_URI: http://airflow:Xq7-mBv.Ld9Rn2@localhost:5050
      - name: Run cornflow
        run: |
          cd ..
          cd ..
          cd cornflow-server
          uv venv cfvenv --python "$(python -c 'import sys; print(sys.executable)')"
          source cfvenv/bin/activate
          uv pip install -r requirements.txt
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          uv pip install --reinstall-package cornflow-client \
            "cornflow-client @ git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
          flask db upgrade -d cornflow/migrations/
          flask access_init
          flask register_deployed_dags -r http://127.0.0.1:8080 -u admin -p admin
          flask create_admin_user -u admin -e admin@cornflow.org -p Kd8-rVt.Nq2Wp5
          flask create_service_user -u airflow -e airflow@cornflow.org -p Xq7-mBv.Ld9Rn2
          flask create_base_user -u user -e user@cornflow.org -p Zc4-hJm.Bt6Vx9
          flask register_dag_permissions -o 1
          flask run -p 5050 &
          deactivate
          sleep 5s
        env:
          FLASK_ENV: testing
          FLASK_APP: cornflow.app
          AIRFLOW_URL: http://127.0.0.1:8080
          AIRFLOW_USER: admin
          AIRFLOW_PWD: admin
          SECRET_KEY: THISNEEDSTOBECHANGED_THISNEEDSTOBECHANGED
          SECRET_BI_KEY: THISNEEDSTOBECHANGED_THISNEEDSTOBECHANGED_BI
          OPEN_DEPLOYMENT: 1
          AUTH_TYPE: 1
          LOG_LEVEL: 10
          CORNFLOW_SERVICE_USER: airflow
          SIGNUP_ACTIVATED: 1
          # The client integration tests exercise the API, not the security
          # policies: the server (started with `flask run`, i.e. the factory's
          # default "development" config) must not require MFA nor rate-limit
          # the repeated logins these tests perform.
          MFA_REQUIRED: 0
          RATELIMIT_ENABLED: 0
      - name: Run unit tests
        run: |
          coverage run --source=./cornflow_client/ --rcfile=./.coveragerc -m unittest discover -s cornflow_client/tests/unit
          coverage report -m
      - name: Run integration tests
        run: |
          coverage run -a --source=./cornflow_client/ --rcfile=./.coveragerc -m unittest discover -s cornflow_client/tests/integration
          coverage report -m
          coverage xml
      - name: Show failed Airflow task logs
        if: failure()
        run: |
          LOGS="${GITHUB_WORKSPACE}/cornflow-server/airflow_config/logs"
          grep -rl "Task failed with exception" "$LOGS" 2>/dev/null | head -n 20 | while read -r f; do
            echo "===== $f"
            tail -n 80 "$f"
          done
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: client-tests
          token: ${{secrets.CODECOV_TOKEN}}