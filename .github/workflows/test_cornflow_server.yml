name: cornflow-server tests

on:
  pull_request:
    # `edited` is left out on purpose: it fires when the PR title or description changes
    types: [opened, synchronize, reopened]
    paths:
      - 'cornflow-server/**'
      - '.github/workflows/test_cornflow_server.yml'
      - '!cornflow-server/docs/**'
      - '!cornflow-server/README.rst'
  push:
    branches:
      - master
    paths:
      - 'cornflow-server/**'
      - '.github/workflows/test_cornflow_server.yml'
      - '!cornflow-server/docs/**'
      - '!cornflow-server/README.rst'

# A new push to the same PR cancels the run still going for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Unit, ldap and postgres suites: they do not need Airflow, so they run on every Python
  # version without waiting for it to install.
  unit:
    name: Unit tests on cornflow-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cornflow-server
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: cornflow-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgresadmin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'cornflow-server/requirements*.txt'
      - name: Copy DAG files
        run: |
          cd ..
          cp -r cornflow-dags/DAG/* cornflow-server/airflow_config/dags/
          cp cornflow-dags/requirements.txt cornflow-server/airflow_config/
      - name: Start LDAP
        run: |
          docker run --volume $GITHUB_WORKSPACE/cornflow-server/airflow_config:/etc/ldap.dist/prepopulate \
          -e SLAPD_DOMAIN=example.org \
          -e SLAPD_PASSWORD=admin \
          -d -p 389:389 dinkel/openldap
      - name: Install dependencies
        run: |
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --reinstall-package cornflow-client \
            "cornflow-client @ git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
      - name: Run unit tests
        # In parallel, one SQLite file per worker (see conftest.py), kept in RAM under /dev/shm:
        # every test creates and drops all the tables, which is slow on disk.
        run: |
          python -m pytest -n auto -q -p no:cacheprovider \
            --cov=cornflow --cov-config=.coveragerc --cov-report= \
            cornflow/tests/unit
          coverage report -m
        env:
          FLASK_ENV: testing
          OPEN_DEPLOYMENT: 1
          DATABASE_URL: sqlite:////dev/shm/cornflow_test.db
          LOG_LEVEL: 30
          AIRFLOW_USER: notadmin
          AIRFLOW_PWD: notadmin
          CF_ALARMS_ENDPOINT: 1
      - name: Run ldap unit tests
        run: |
          coverage run -a --source=./cornflow/ --rcfile=./.coveragerc -m unittest discover -s cornflow/tests/ldap
          coverage report -m
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:////dev/shm/cornflow_test.db
          AUTH_TYPE: 2
          OPEN_DEPLOYMENT: 1
          LDAP_HOST: ldap://localhost:389
          LDAP_BIND_PASSWORD: admin
          LDAP_GROUP_BASE: dc=example,dc=org
          LDAP_GROUP_OBJECT_CLASS: groupOfNames
          LDAP_PROTOCOL_VERSION: 3
          LDAP_BIND_DN: cn=admin,dc=example,dc=org
          LDAP_USE_TLS: False
          LDAP_USERNAME_ATTRIBUTE: cn
          LDAP_USER_BASE: ou=users,dc=example,dc=org
          LDAP_SERVICE_BASE: ou=service,dc=example,dc=org
          LDAP_EMAIL_ATTRIBUTE: mail
          LDAP_USER_OBJECT_CLASS: inetOrgPerson
          LDAP_GROUP_ATTRIBUTE: cn
          LDAP_GROUP_TO_ROLE_SERVICE: services
          LDAP_GROUP_TO_ROLE_ADMIN: administrators
          LDAP_GROUP_TO_ROLE_VIEWER: viewers
          LDAP_GROUP_TO_ROLE_PLANNER: planners
          LOG_LEVEL: 30
          CORNFLOW_SERVICE_USER: cornflow
      - name: Run postgres unit tests
        run: |
          coverage run -a --source=./cornflow/ --rcfile=./.coveragerc -m unittest cornflow/tests/unit/test_commands.py
          coverage report -m
          coverage xml
        env:
          FLASK_ENV: testing
          OPEN_DEPLOYMENT: 1
          DATABASE_URL: postgresql://postgres:postgresadmin@127.0.0.1:5432/cornflow-test
          LOG_LEVEL: 30
          CF_ALARMS_ENDPOINT: 1
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: server-tests
          token: ${{secrets.CODECOV_TOKEN}}

  # Integration suite against a real Airflow. It checks behaviour, not the Python version,
  # so it runs once, on the newest version, in parallel with the unit job.
  integration:
    name: Integration tests on cornflow-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cornflow-server

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            cornflow-server/requirements*.txt
            cornflow-dags/requirements.txt
      - name: Copy DAG files
        run: |
          cd ..
          cp -r cornflow-dags/DAG/* cornflow-server/airflow_config/dags/
          cp cornflow-dags/requirements.txt cornflow-server/airflow_config/
      - name: Install dependencies
        run: |
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --reinstall-package cornflow-client \
            "cornflow-client @ git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
      - name: Install airflow
        run: |
          uv venv afvenv --python "$(python -c 'import sys; print(sys.executable)')"
          source afvenv/bin/activate
          AIRFLOW_VERSION=3.2.2
          PYTHON_VERSION="$(python3 --version | cut -d " " -f 2 | cut -d "." -f 1-2)"
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          # The fab extra provides FabAuthManager and the `airflow users create` CLI,
          # which moved out of Airflow core in Airflow 3.
          uv pip install "apache-airflow[fab]==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          uv pip install -r airflow_config/requirements.txt
          uv pip install --reinstall-package cornflow-client \
            "cornflow-client @ git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
          # Airflow 3 replaced `db init` with the idempotent `db migrate`
          airflow db migrate
          airflow users create \
                --username admin \
                --firstname admin \
                --lastname admin \
                --role Admin \
                --password admin \
                --email admin@example.org
          # Airflow 3 renamed `webserver` to `api-server` and no longer parses DAGs in the
          # scheduler: a standalone dag-processor is mandatory.
          airflow api-server -p 8080 &
          airflow scheduler &
          airflow dag-processor &
          # Wait for the api-server to answer and for the dag-processor to parse the DAGs
          # before cornflow registers them.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v2/monitor/health > /dev/null; then break; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if airflow dags list -o json 2>/dev/null | grep -q '"solve_model_dag"'; then break; fi
            sleep 2
          done
          airflow dags list
          # Import errors are only written to the dag-processor log files, so surface them here
          airflow dags list-import-errors
          deactivate
        env:
          AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 0
          AIRFLOW_HOME: '${GITHUB_WORKSPACE}/cornflow-server/airflow_config'
          AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 0
          # Airflow 3: AUTH_BACKENDS (plural) replaces AUTH_BACKEND, and the FAB auth manager
          # has to be selected explicitly (it backs `airflow users create`)
          AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
          AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
          # Shared JWT secret between api-server, scheduler and dag-processor
          AIRFLOW__API_AUTH__JWT_SECRET: 4f8c1b2e9d7a6c5b3e2f1a0d9c8b7a6e5f4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
          AIRFLOW__API__SECRET_KEY: e9adafa751fd35adfc1fdd3285019be15eea0758f76e38e1e37a1154fb36
          AIRFLOW__CORE__LOAD_EXAMPLES: 0
          AIRFLOW_CONN_CF_URI: http://airflow:Xq7-mBv.Ld9Rn2@localhost:5050
      - name: Run integration tests
        run: |
          coverage run --source=./cornflow/ --rcfile=./.coveragerc -m unittest discover -s cornflow/tests/integration
          coverage report -m
          coverage xml
        env:
          FLASK_ENV: testing
          OPEN_DEPLOYMENT: 1
          DATABASE_URL: sqlite:///cornflow_test.db
          LOG_LEVEL: 30
      - name: Show failed Airflow task logs
        if: failure()
        run: |
          LOGS="${GITHUB_WORKSPACE}/cornflow-server/airflow_config/logs"
          grep -rl "Task failed with exception" "$LOGS" 2>/dev/null | head -n 20 | while read -r f; do
            echo "===== $f"
            tail -n 80 "$f"
          done
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: server-tests
          token: ${{secrets.CODECOV_TOKEN}}
