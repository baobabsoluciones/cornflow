name: cornflow-dags tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'cornflow-dags/**'
      - '.github/workflows/test_cornflow_dags.yml'
      - '!cornflow-dags/README.rst'
  push:
    branches:
      - master
    paths:
      - 'cornflow-dags/**'
      - '.github/workflows/test_cornflow_dags.yml'
      - '!cornflow-dags/README.rst'

jobs:
  testing:
    name: Run all test suites on cornflow-dags
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./cornflow-dags
    strategy:
      max-parallel: 21
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install cbc
        run: |
          sudo apt-get install -y coinor-cbc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements-dev.txt
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          python -m pip uninstall cornflow-client -y
          python -m pip install -U "git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
      - name: Install airflow
        run: |
          AIRFLOW_VERSION=3.2.2
          PYTHON_VERSION="$(python3 --version | cut -d " " -f 2 | cut -d "." -f 1-2)"
          CLIENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          # The fab extra provides FabAuthManager and the `airflow users create` CLI,
          # which moved out of Airflow core in Airflow 3.
          python -m pip install "apache-airflow[fab]==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          python -m pip install -U orloge pulp
          python -m pip install -U "git+https://github.com/baobabsoluciones/cornflow@${CLIENT_BRANCH}#subdirectory=libs/client"
          # Airflow 3 replaced `db init` with the idempotent `db migrate`
          airflow db migrate
          airflow users create \
                --username admin \
                --firstname admin \
                --lastname admin \
                --role Admin \
                --password admin \
                --email admin@example.org
          # Airflow 3 renamed `webserver` to `api-server` and no longer parses DAGs in the
          # scheduler: a standalone dag-processor is mandatory.
          airflow api-server -p 8080 &
          airflow scheduler &
          airflow dag-processor &
          # Wait for the api-server to answer and for the dag-processor to parse the DAGs
          # before the integration tests trigger them.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v2/monitor/health > /dev/null; then break; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if airflow dags list -o json 2>/dev/null | grep -q '"update_all_schemas"'; then break; fi
            sleep 2
          done
          airflow dags list
          # Import errors are only written to the dag-processor log files, so surface them here
          airflow dags list-import-errors
        env:
          AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 0
          AIRFLOW_HOME: '${GITHUB_WORKSPACE}'
          AIRFLOW__CORE__DAGS_FOLDER: '${GITHUB_WORKSPACE}/cornflow-dags/DAG'
          AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 0
          # Airflow 3: AUTH_BACKENDS (plural) replaces AUTH_BACKEND, and the FAB auth manager
          # has to be selected explicitly (it backs `airflow users create`)
          AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
          AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
          # Shared JWT secret between api-server, scheduler and dag-processor
          AIRFLOW__API_AUTH__JWT_SECRET: 4f8c1b2e9d7a6c5b3e2f1a0d9c8b7a6e5f4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b
          AIRFLOW__API__SECRET_KEY: e9adafa751fd35adfc1fdd3285019be15eea0758f76e38e1e37a1154fb36
          AIRFLOW__CORE__LOAD_EXAMPLES: 0
          AIRFLOW_CONN_CF_URI: cornflow://airflow_test@admin.com:airflow_test_password@localhost:5000
      - name: Run unit tests
        run: |
          coverage run --source=. --rcfile=./.coveragerc -m unittest discover -s ./tests/unit
          coverage report -m
      - name: Run integration tests
        run: |
          coverage run -a --source=. --rcfile=./.coveragerc -m unittest discover -s ./tests/integration
          coverage report -m
          coverage xml
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        with:
          flags: dags-tests
          token: ${{secrets.CODECOV_TOKEN}}
