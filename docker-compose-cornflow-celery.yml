# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# Feel free to modify this file to suit your needs.
version: "3.8"

x-airflow-common: &airflow-common
  # In order to add custom dependencies or upgrade provider packages you can use your extended image.
  # Comment the image line and uncomment the "build" and "context" lines below, Then run `docker-compose build` to build the images.
  image: baobabsoluciones/airflow:release-v1.3.8rc3
  platform: linux/amd64
  #build:
  #context: ./cornflow-server/airflow_config
  environment: &airflow-common-env
    AIRFLOW_USER: admin
    AIRFLOW_PWD: admin
    AIRFLOW_DB_HOST: airflow_db
    AIRFLOW_DB_PORT: 5432
    AIRFLOW_DB_USER: airflow
    AIRFLOW_DB_PASSWORD: airflow
    AIRFLOW_DB: airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    # Airflow 3's api-server signs/validates JWTs with this secret. Unlike the Fernet key above,
    # it can't be disabled with an empty value, and webserver/scheduler/worker run as separate
    # containers here, so it must be pinned to the same value for all of them explicitly (a
    # per-container random default, like the one the image generates as a fallback, would break
    # task execution since tasks authenticate against the api-server through this secret).
    AIRFLOW__API_AUTH__JWT_SECRET: "dev-only-jwt-secret-change-me-1a2b3c4d5e6f7a8b9c0d"
    EXECUTOR: Celery
    # Airflow 3 moved instance_name from [webserver] to [api]; navbar_color has no equivalent
    # in the new React-based UI and was dropped.
    AIRFLOW__API__INSTANCE_NAME: CornflowEnv
    # Airflow 3: AUTH_BACKENDS (plural) replaces AUTH_BACKEND (singular)
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Airflow 3: the auth manager is now explicit (FAB moved out of core into
    # apache-airflow-providers-fab); it's what backs `airflow users create`
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  volumes:
    - ./cornflow-dags/DAG:/usr/local/airflow/dags
    - ./cornflow-dags/requirements.txt:/requirements.txt
    - ./cornflow-server/airflow_config/logs:/usr/local/airflow/logs
    - ./cornflow-server/airflow_config/plugins:/usr/local/airflow/plugins
    - ./cornflow-server/airflow_config/airflow_local_settings.py:/usr/local/airflow/config/airflow_local_settings.py
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    airflow_db:
      condition: service_healthy

x-cornflow-common: &cornflow-common
  # In order to add custom dependencies or upgrade provider packages you can use your extended image.
  # Comment the image line and uncomment the "build" and "context" lines below, Then run `docker-compose build` to build the images.
  image: baobabsoluciones/cornflow:release-v1.3.8rc3
  platform: linux/amd64
  #  build:
  #    context: ./cornflow-server
  environment: &cornflow-common-env
    CORNFLOW_ADMIN_USER: cornflow_admin
    CORNFLOW_ADMIN_PWD: Cornflow_admin1234
    CORNFLOW_SERVICE_USER: service_user
    CORNFLOW_SERVICE_PWD: Service_user1234
    CORNFLOW_DB_HOST: cornflow_db
    CORNFLOW_DB_PORT: 5432
    CORNFLOW_DB_USER: cornflow
    CORNFLOW_DB_PASSWORD: cornflow
    CORNFLOW_DB: cornflow
  depends_on: &cornflow-common-depends-on
    cornflow_db:
      condition: service_healthy
    webserver:
      condition: service_healthy

services:
  cornflow:
    <<: *cornflow-common
    restart: always
    ports:
      - 5000:5000
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/src/app/gunicorn.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 5
    environment:
      <<: *cornflow-common-env
    depends_on:
      <<: *cornflow-common-depends-on

  cornflow_db:
    image: postgres:15.4
    environment:
      - POSTGRES_USER=cornflow
      - POSTGRES_PASSWORD=cornflow
      - POSTGRES_DB=cornflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cornflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    volumes:
      - postgres_cf_data:/var/lib/postgresql/data/

  airflow_db:
    image: postgres:15.4
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_af_data:/var/lib/postgresql/data/

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8080:8080
    healthcheck:
      # Airflow 3's webserver process is now `airflow api-server`; check its health endpoint
      # instead of a pid file (the pid file it writes is no longer guaranteed to be named
      # airflow-webserver.pid).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 5
    environment:
      <<: *airflow-common-env
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  # Airflow 3 always requires a standalone dag-processor process; the scheduler no longer parses
  # DAG files itself.
  dag-processor:
    <<: *airflow-common
    command: dag-processor
    environment:
      <<: *airflow-common-env
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: flower
    profiles:
      - flower
    ports:
      - "5555:5555"
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  redis:
    image: redis:latest
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  worker:
    <<: *airflow-common
    command: worker
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres_cf_data:
  postgres_af_data:
